name: Deploy site

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
        with:
          repository: dian-mitux/portfolio-site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: src
          persist-credentials: false

      - name: Refresh contribution calendar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 src/scripts/refresh_contributions.py dian-mitux

      - name: Assemble site
        run: |
          mkdir _site
          cp -R src/index.html src/assets src/data _site/

      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Pages keeps serving the old site when a build version repeats, and the version must be a commit in
      # this repo (actions/deploy-pages#383). This repo rarely changes, so each run deploys under a new empty commit.
      - id: deployment
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const { data: parent } = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.object.sha });
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo, message: `chore: 发布 ${new Date().toISOString()}`, tree: parent.tree.sha, parents: [parent.sha],
            });
            await github.rest.git.updateRef({ owner, repo, ref: 'heads/main', sha: commit.sha });
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: commit.sha,
              oidc_token: await core.getIDToken(),
            });
            core.setOutput('page_url', data.page_url);
            const FINAL_ERRORS = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            for (let i = 0; i < 120; i++) {
              const { data: d } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id: data.id });
              core.info(`Pages deployment ${commit.sha.slice(0, 7)}: ${d.status}`);
              if (d.status === 'succeed') return;
              if (FINAL_ERRORS.includes(d.status)) throw new Error(`Pages deployment ${d.status}`);
              await new Promise(r => setTimeout(r, 5000));
            }
            throw new Error('Pages deployment did not finish in 10 minutes');
